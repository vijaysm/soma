# The documentation under docs/ is the one source of both the Read the Docs
# site and the GitHub wiki. On a pull request this checks that the pages build
# with Sphinx (warnings are errors) and convert to wiki pages; on a push to
# main it also regenerates the wiki and pushes it.
#
# The wiki must exist first: enable it in the repository settings and create
# any first page in the web editor. The push uses the workflow's GITHUB_TOKEN;
# if the repository's settings keep that token read-only, store a token that
# may write the repository as the secret WIKI_TOKEN instead.

name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "PROVENANCE.md", ".github/workflows/wiki.yml"]
  pull_request:
    paths: ["docs/**", "PROVENANCE.md", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Sphinx site
        run: |
          python -m pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Convert to wiki pages
        run: |
          python tests/docs/test_build_wiki.py
          python docs/wiki/build_wiki.py --check
      - name: Push the wiki
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            wiki="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki"
            echo "::error title=No wiki to push to::GitHub creates the wiki's repository only when its" \
              "first page is saved. Open ${wiki}, save any page, and run this workflow again."
            exit 1
          fi
          python docs/wiki/build_wiki.py --out wiki --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::12}"
          git push origin HEAD
