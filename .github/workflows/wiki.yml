# The documentation under docs/ is the one source of both the Read the Docs
# site and the GitHub wiki. On a pull request this checks that the pages build
# with Sphinx (warnings are errors), with the API reference Doxygen makes from
# the headers, and convert to wiki pages; on a push to main it also regenerates
# the wiki and pushes it.
#
# The wiki must exist first: enable it in the repository settings and create
# any first page in the web editor. The push uses the workflow's GITHUB_TOKEN;
# if the repository's settings keep that token read-only, store a token that
# may write the repository as the secret WIKI_TOKEN instead.

name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "include/**", "tools/**", "PROVENANCE.md", ".github/workflows/wiki.yml"]
  pull_request:
    paths: ["docs/**", "include/**", "tools/**", "PROVENANCE.md", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Doxygen (the release the docs are checked with)
        run: |
          curl -sSfL --max-time 300 -o /tmp/doxygen.tgz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz
          echo "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2  /tmp/doxygen.tgz" | sha256sum -c -
          tar -xzf /tmp/doxygen.tgz -C /tmp
          echo /tmp/doxygen-1.17.0/bin >> "$GITHUB_PATH"
      - name: Build the Sphinx site
        run: |
          python -m pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Check the reference and the figures, and convert to wiki pages
        run: |
          python tests/docs/test_doxify.py
          python tests/docs/test_check_api.py
          python docs/reference/check_api.py
          python tests/docs/test_check_figures.py
          python docs/figures/check_figures.py
          python tests/docs/test_build_wiki.py
          python docs/wiki/build_wiki.py --check
      - name: Push the wiki
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            wiki="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki"
            echo "::error title=No wiki to push to::GitHub creates the wiki's repository only when its" \
              "first page is saved. Open ${wiki}, save any page, and run this workflow again."
            exit 1
          fi
          python docs/wiki/build_wiki.py --out wiki --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::12}"
          git push origin HEAD
